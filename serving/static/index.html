<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关键词提取 · Qwen2.5-SFT</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6ee7ff;
      --accent2: #a78bfa;
      --text: #e6e9ef;
      --muted: #8b93a7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1b2440 0%, transparent 60%),
                  radial-gradient(900px 500px at 100% 0%, #2a1840 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .wrap { width: 100%; max-width: 720px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 14px;
      font-size: 14px;
      line-height: 1.6;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(110, 231, 255, 0.15); }
    .btn {
      margin-top: 14px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #08111f;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
    }
    .btn:hover { transform: translateY(-2px) scale(1.01); }
    .btn:active { transform: translateY(0) scale(0.99); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .result { margin-top: 22px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      background: rgba(110, 231, 255, 0.12);
      border: 1px solid rgba(110, 231, 255, 0.3);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .meta { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); font-size: 13px; font-style: italic; }
    .err { color: #ff8080; font-size: 13px; margin-top: 10px; }
    .foot { margin-top: 18px; color: var(--muted); font-size: 11px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>关键词提取</h1>
      <div class="sub">基于 Qwen2.5-7B-Instruct 微调模型 · vLLM 推理 · FastAPI 服务</div>

      <textarea id="input" placeholder="粘贴一段文本，例如：知识管理是知识经济时代的核心能力，企业需要构建知识市场来提升知识共享与创新的效率。"></textarea>
      <button class="btn" id="run">提取关键词</button>

      <div class="result" id="result">
        <div class="empty">结果将显示在这里</div>
      </div>
      <div class="err" id="err"></div>

      <div class="foot">SFT 微调项目 · 关键词提取服务 Demo</div>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const runBtn = document.getElementById("run");
    const result = document.getElementById("result");
    const errEl = document.getElementById("err");

    runBtn.addEventListener("click", async () => {
      const text = input.value.trim();
      errEl.textContent = "";
      if (!text) { errEl.textContent = "请输入文本"; return; }

      runBtn.disabled = true;
      runBtn.textContent = "提取中…";
      result.innerHTML = '<div class="empty">模型推理中…</div>';

      try {
        const resp = await fetch("/api/extract", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || "请求失败");

        const tags = data.keywords.map(k => `<span class="tag">${k}</span>`).join("");
        result.innerHTML = `<div class="tags">${tags}</div>
          <div class="meta">推理耗时 ${data.elapsed_ms} ms · 提取 ${data.keywords.length} 个关键词</div>`;
      } catch (e) {
        result.innerHTML = "";
        errEl.textContent = "错误: " + e.message;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "提取关键词";
      }
    });
  </script>
</body>
</html>
